name: Deploy release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (vite + tsup)
        run: pnpm run build:pack

      - name: Pack distributable
        run: node scripts/pack-release.mjs

      - name: Push pack/ to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # checkout@v4 only fetches the triggering ref (main) by default, so
          # origin/release doesn't exist locally yet even once the branch exists on
          # the remote. Without this fetch every run falls through to the orphan
          # branch below, and the second push ever made would be rejected as a
          # non-fast-forward (new orphan history vs. the real remote branch).
          git fetch origin release 2>/dev/null || true

          git worktree add -B release .release-worktree origin/release 2>/dev/null || {
            git worktree add --detach .release-worktree
            git -C .release-worktree checkout --orphan release
            git -C .release-worktree rm -rf . >/dev/null 2>&1 || true
          }

          rsync -a --delete --exclude .git pack/ .release-worktree/

          cd .release-worktree
          git add -A
          if git diff --cached --quiet; then
            echo "no changes, skipping push"
            exit 0
          fi
          git commit -m "Release build from ${GITHUB_SHA}"
          git push origin release
